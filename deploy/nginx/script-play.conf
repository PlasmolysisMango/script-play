# script-play 对外入口：nginx 发前端静态资源，Go 只在本机 9092 上跑 API 与 WebSocket。
#
# 安装：cp deploy/nginx/script-play.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# 前端产物：make web-publish（web/dist → /usr/share/nginx/script-play）
#
# 站点根必须放在 /root 之外：nginx worker 以 nginx 用户运行，进不去 750 的 /root。
server {
    listen 9091;
    server_name _;

    root /usr/share/nginx/script-play;
    index index.html;
    server_tokens off;

    # 原件上传走这里。必须 ≥ 后端「单文件上限 × materialRequestFactor」
    # （SP_MAX_UPLOAD_MB 默认 256，整请求上限 512）：比后端小的话请求根本到不了
    # Go，浏览器只能收到 nginx 自己的 HTML 413 页，后端的友好提示永远看不到。
    client_max_body_size 512m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite 产物名带指纹，可以永久缓存。缺失就是缺失，不能回落到外壳：浏览器拿到
    # text/html 当 JS 执行，会报 MIME 错并白屏。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 外壳是唯一指向当前产物名的文件，缓存旧版会把浏览器钉在旧 bundle 上。
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }

    # ^~ 是关键：否则下面的「图片扩展名 =404」正则位置会优先匹配到
    # /script-assets/…/map.jpg，把它当成站点根下的文件而 404。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        # 不把请求体先缓到磁盘：几百 MB 的原件会先落 nginx 临时目录、再由 Go 写
        # 一遍，双倍 IO；关掉后字节边上传边交给后端。
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一次 AI 生成默认最长 180s，留出余量；默认的 60s 会在生成中途断掉。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 长连接。Upgrade/Connection 必须显式透传，否则握手永远 400。
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 线索图：工作台上传的落 <SP_DATA_DIR>/media/<剧本 id>/，随剧本固化的
    # 落 scripts/<剧本目录>/images/。两者都由 Go 发，nginx 只转发。
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /script-assets/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 静态资源不存在就是不存在：既包括过期的 /story/…，也包括漏拷的图片。
    # 回落成 index.html 会让浏览器把 HTML 当图片/脚本，报错很难查。
    location ~* \.(png|jpe?g|webp|gif|svg|ico|map|txt)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
